# Docker Compose for development server
# Uses remote database - see configuration in api/.env_devserver

version: "3.9"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    env_file:
      - ./frontend/.env.devserver
    ports:
      - "5173:80"
    depends_on:
      - api
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`pvacd-dev.newmexicowaterdata.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure,web"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"

      # - "traefik.http.routers.frontend-insecure.middlewares=force-secure"
      # - "traefik.http.middlewares.force-secure.redirectscheme.scheme=https"
      # - "traefik.http.middlewares.force-secure.redirectscheme.permanent=true"

  api:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    working_dir: /app
    environment:
      - GCP_BUCKET_NAME=pvacd
      - GCP_WOODPECKER_BUCKET_NAME=pvacd-woodpecker
      - GCP_BACKUP_PREFIX=pre-prod-db-backups
      - GCP_PHOTO_PREFIX=pre-prod-meter-activities-photos
      - BACKUP_RETENTION_DAYS=14
      - APPDB_ENV=.env_devserver
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --root-path /api/v1
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api
    depends_on:
      - traefik
    env_file:
      - ./api/.env_devserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`pvacd-dev.newmexicowaterdata.org`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.routers.api.middlewares=api-sp"
      - "traefik.http.middlewares.api-sp.stripprefix.prefixes=/api/v1"
      - "traefik.http.middlewares.api-sp.stripprefix.forceSlash=false"
      - "traefik.http.routers.api-insecure.rule=Host(`pvacd-dev.newmexicowaterdata.org`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api-insecure.entrypoints=web"

      # - "traefik.http.routers.api-insecure.middlewares=force-secure"
      # - "traefik.http.middlewares.force-secure.redirectscheme.scheme=https"
      # - "traefik.http.middlewares.force-secure.redirectscheme.permanent=true"

  traefik:
    image: "traefik:v2.11"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=newmexicowaterdata@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./letsencrypt:/letsencrypt
