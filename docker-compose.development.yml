# Docker Compose for development server
# Uses remote database - see configuration in api/.env_devserver

version: "3.9"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        VITE_APP_ENV: pre-production
        VITE_API_URL: https://metermanager-dev.pvacd.com/api/v1
    env_file:
      - ./frontend/.env.devserver
    depends_on:
      - api
      - traefik
    labels:
      - "traefik.enable=true"

      # Current PVACD hostname
      - "traefik.http.routers.frontend.rule=Host(`metermanager-dev.pvacd.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"

      # Old PVACD hostname
      - "traefik.http.routers.pvacd-old.rule=Host(`pvacd-dev.newmexicowaterdata.org`)"
      - "traefik.http.routers.pvacd-old.entrypoints=websecure"
      - "traefik.http.routers.pvacd-old.tls=true"
      - "traefik.http.routers.pvacd-old.tls.certresolver=myresolver"
      - "traefik.http.routers.pvacd-old.middlewares=pvacd-redirect"

      # Permanent redirect to new hostname
      - "traefik.http.middlewares.pvacd-redirect.redirectregex.regex=^https://pvacd-dev\\.newmexicowaterdata\\.org/(.*)"
      - "traefik.http.middlewares.pvacd-redirect.redirectregex.replacement=https://metermanager-dev.pvacd.com/$${1}"
      - "traefik.http.middlewares.pvacd-redirect.redirectregex.permanent=true"

      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  api:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    working_dir: /app
    environment:
      - APP_ENV=pre-production
      - API_BASE_URL=https://metermanager-dev.pvacd.com/api/v1
      - GCP_BUCKET_NAME=meter-manager-bucket
      - GCP_WOODPECKER_BUCKET_NAME=meter-manager-woodpecker-bucket
      - GCP_BACKUP_PREFIX=pre-prod-db-backups
      - GCP_PHOTO_PREFIX=pre-prod-meter-activities-photos
      - GCP_SERVICE_ACCOUNT=13393509252-compute@developer.gserviceaccount.com
      - BACKUP_RETENTION_DAYS=14
      - APPDB_ENV=.env_devserver
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --root-path /api/v1
    volumes:
      - ./api:/app/api
    depends_on:
      - traefik
    env_file:
      - ./api/.env_devserver
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api.rule=Host(`metermanager-dev.pvacd.com`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.routers.api.priority=100"

      - "traefik.http.routers.api.middlewares=api-sp"
      - "traefik.http.middlewares.api-sp.stripprefix.prefixes=/api/v1"
      - "traefik.http.middlewares.api-sp.stripprefix.forceSlash=false"

      - "traefik.http.services.api.loadbalancer.server.port=8000"

  traefik:
    image: "traefik:v2.11"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=newmexicowaterdata@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./letsencrypt:/letsencrypt
