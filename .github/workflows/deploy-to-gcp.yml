name: Deploy to GCP Compute VM

on:
  push:
    branches:
      - pre-production
      - production

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Compose File based on Branch
        id: set-compose
        run: |
          if [[ "${GITHUB_REF##*/}" == "production" ]]; then
            echo "COMPOSE_FILE=docker-compose.production.yml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.development.yml" >> $GITHUB_ENV
          fi

      - name: SSH Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOYMENT_PATH }}

            echo "Switching to branch ${GITHUB_REF##*/}..."
            git fetch origin
            git checkout ${GITHUB_REF##*/}
            git pull origin ${GITHUB_REF##*/}

            echo "Bringing down existing containers..."
            docker compose -f ${{ env.COMPOSE_FILE }} down

            echo "Building and starting new containers with ${{ env.COMPOSE_FILE }}..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --build

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment for ${GITHUB_REF##*/} branch complete."
